name: build-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android platform (uses preinstalled SDK)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "Using SDK: $SDK"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build debug APK
        run: dotnet build -c Debug -p:AndroidPackageFormat=apk

      - name: Verify APK manifest
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/aapt2 | sort -V | tail -n1)"
          APK="$(ls bin/Debug/net10.0-android36.0/*-Signed.apk | head -n1)"
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity|native-code)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrails-android-debug-apk
          path: bin/Debug/net10.0-android36.0/*-Signed.apk
          if-no-files-found: error
